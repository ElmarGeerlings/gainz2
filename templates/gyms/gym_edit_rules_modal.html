<form id="gym-edit-rules-form" class="form-stack">
    <h2 class="title-md m-0 mb-3">Edit gym rules</h2>
    <div class="stack-sm">
        {% for rule in rules %}
        <div class="stack-xs gym-rule-edit-row" data-rule-slug="{{ rule.slug }}">
            <span class="text-sm fw-700">{{ rule.label }}</span>
            <div class="gym-status-btns" role="radiogroup" aria-label="{{ rule.label }}">
                <label class="gym-status-btn gym-rule-state-btn gym-tone-yes">
                    <input type="radio" class="gym-status-radio" name="rule_{{ rule.slug }}" value="yes"{% if rule.state == 'yes' %} checked{% endif %}>
                    Yes
                </label>
                <label class="gym-status-btn gym-rule-state-btn gym-tone-no">
                    <input type="radio" class="gym-status-radio" name="rule_{{ rule.slug }}" value="no"{% if rule.state == 'no' %} checked{% endif %}>
                    No
                </label>
                <label class="gym-status-btn gym-rule-state-btn gym-tone-unknown">
                    <input type="radio" class="gym-status-radio" name="rule_{{ rule.slug }}" value="unknown"{% if rule.state == 'unknown' %} checked{% endif %}>
                    Unknown
                </label>
            </div>
        </div>
        {% endfor %}
    </div>
    <div class="set-modal-actions mt-4">
        <button type="button" class="btn btn-primary w-40 mt-1" data-gym-id="{{ gym.id }}" data-endpoint="click->gyms/update_rules" data-close-modal="#gym-edit-rules-modal">Save</button>
    </div>
</form>
