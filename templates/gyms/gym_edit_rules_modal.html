<form id="gym-edit-rules-form" class="form-stack">
    <h2 class="title-md m-0 mb-3">Edit gym rules</h2>
    <div class="stack-sm">
        {% for rule in rules %}
        <div class="stack-xs gym-rule-edit-row" data-rule-slug="{{ rule.slug }}">
            <span class="text-sm fw-700">{{ rule.label }}</span>
            <input type="hidden" class="gym-rule-edit-value" name="rule_{{ rule.slug }}" value="{{ rule.state }}">
            <div class="gym-status-btns">
                <button type="button" class="gym-status-btn gym-rule-state-btn gym-tone-yes{% if rule.state == 'yes' %} is-active{% endif %}" data-function="click->pickGymChoice" data-value="yes">Yes</button>
                <button type="button" class="gym-status-btn gym-rule-state-btn gym-tone-no{% if rule.state == 'no' %} is-active{% endif %}" data-function="click->pickGymChoice" data-value="no">No</button>
                <button type="button" class="gym-status-btn gym-rule-state-btn gym-tone-unknown{% if rule.state == 'unknown' %} is-active{% endif %}" data-function="click->pickGymChoice" data-value="unknown">Unknown</button>
            </div>
        </div>
        {% endfor %}
    </div>
    <button type="button" class="btn btn-primary w-100 mt-4" data-function="click->saveGymRulesEdit">Save</button>
</form>
