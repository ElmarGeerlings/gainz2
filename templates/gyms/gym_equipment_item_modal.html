<h2 class="title-md m-0 mb-3" id="gym-equipment-item-modal-title">Equipment</h2>
<input type="hidden" id="gym-equipment-item-slug" value="">
<div class="gym-status-btns mb-3" role="radiogroup" aria-label="Equipment status">
    <label class="gym-status-btn gym-tone-yes">
        <input type="radio" class="gym-status-radio" name="equipment_status" value="confirmed" data-function="change->pickGymEquipmentItemStatus">
        Confirmed
    </label>
    <label class="gym-status-btn gym-tone-unknown">
        <input type="radio" class="gym-status-radio" name="equipment_status" value="assumed" data-function="change->pickGymEquipmentItemStatus">
        Assumed
    </label>
    <label class="gym-status-btn gym-tone-no">
        <input type="radio" class="gym-status-radio" name="equipment_status" value="missing" data-function="change->pickGymEquipmentItemStatus">
        Missing
    </label>
</div>
<div id="gym-equipment-quantity-wrap" class="form-stack hidden" hidden>
    <label for="gym-equipment-quantity-input">Quantity</label>
    <input type="text" id="gym-equipment-quantity-input" class="form-control" placeholder="Unknown" autocomplete="off">
</div>
<div class="set-modal-actions mt-4">
    <button type="button" class="btn btn-primary w-40 mt-1" data-function="click->applyGymEquipmentItemModal">Save</button>
</div>
