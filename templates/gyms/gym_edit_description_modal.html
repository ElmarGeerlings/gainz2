<form id="gym-edit-description-form" class="form-stack">
    <input type="hidden" name="gym_id" value="{{ gym.pk }}">
    <h2 class="title-md m-0 mb-3">Edit description</h2>
    <label for="gym-edit-description">Description</label>
    <textarea id="gym-edit-description" name="description" class="form-control" rows="6">{{ gym.description }}</textarea>
    <button type="button" class="btn btn-primary w-100 mt-2" data-endpoint="click->gyms/update_description" data-close-modal="#gym-edit-description-modal">Save</button>
</form>
