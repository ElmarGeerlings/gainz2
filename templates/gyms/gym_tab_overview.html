<section id="gym-panel-overview" class="gym-panel stack-md{% if tab != 'overview' %} hidden{% endif %}" role="tabpanel" aria-labelledby="gym-tab-overview"{% if tab != 'overview' %} hidden{% endif %}>
    <section class="panel stack-sm">
        <div class="row-between gap-sm">
            <h2 class="title-sm m-0">Description</h2>
            <button type="button" class="icon-btn" aria-label="Edit description" data-function="click->openGymDescriptionEdit">
                <i class="fas fa-pen" aria-hidden="true"></i>
            </button>
        </div>
        <p class="text-sm m-0" id="gym-description-display">{{ gym.description }}</p>
        {% if not gym.description %}
        <p class="text-sm text-muted m-0" id="gym-description-empty">No description yet</p>
        {% endif %}
    </section>
    <section class="panel stack-sm">
        <div class="row-between gap-sm">
            <h2 class="title-sm m-0">Vibe</h2>
            <button type="button" class="icon-btn" aria-label="Edit vibe" data-function="click->openGymVibeEdit">
                <i class="fas fa-pen" aria-hidden="true"></i>
            </button>
        </div>
        <p class="text-sm m-0" id="gym-vibe-display" data-vibe="{{ gym.vibe }}">{{ gym.get_vibe_display }}</p>
    </section>
    <button type="button" class="panel w-100" data-function="click->jumpToGymHours">
        {% if has_hours %}
        <div class="row-between gap-sm">
            {% if is_open_now %}
            <span class="text-sm fw-700 text-success">Open now</span>
            {% else %}
            <span class="text-sm fw-700 text-danger">Closed</span>
            {% endif %}
            <span class="text-sm fw-700 m-0" id="gym-open-now-hours">{{ today_hours }}</span>
        </div>
        <p class="text-sm text-muted m-0 mt-2">Holiday hours may vary.</p>
        {% else %}
        <span class="text-sm fw-700 text-muted m-0" id="gym-open-now-hours">No opening hours</span>
        {% endif %}
    </button>
    <button type="button" class="panel stack-sm w-100" data-function="click->ShowModal" data-modal-name="gym-score-modal">
        <h2 class="title-sm m-0">Discipline scores</h2>
        {% for score in discipline_scores %}
        <div class="row-between gap-sm text-sm">
            <span>{{ score.name }}</span>
            <span class="fw-700">{{ score.confirmed }}/{{ score.total }}</span>
        </div>
        {% endfor %}
    </button>
    <button type="button" class="panel stack-sm w-100" data-function="click->openGymPricesRead">
        <h2 class="title-sm m-0">Prices</h2>
        {% if not price_plans %}
        <p class="text-sm text-muted m-0" id="gym-price-headline-empty">No price information available</p>
        <div id="gym-price-headline-day-row" class="row-between gap-sm text-sm" hidden>
            <span>Day pass</span>
            <span class="fw-700" id="gym-price-headline-day"></span>
        </div>
        <div id="gym-price-headline-subscription-row" class="row-between gap-sm text-sm" hidden>
            <span>Subscription</span>
            <span class="fw-700" id="gym-price-headline-subscription"></span>
        </div>
        {% else %}
        <p class="text-sm text-muted m-0" id="gym-price-headline-empty" hidden>No price information available</p>
        <div id="gym-price-headline-day-row" class="row-between gap-sm text-sm">
            <span>Day pass</span>
            {% if gym.day_pass_price is not None %}
            <span class="fw-700" id="gym-price-headline-day">€{{ gym.day_pass_price|floatformat:"-2" }}</span>
            {% else %}
            <span class="fw-700" id="gym-price-headline-day">No day pass</span>
            {% endif %}
        </div>
        {% if gym.monthly_price is not None %}
        <div id="gym-price-headline-subscription-row" class="row-between gap-sm text-sm">
            <span>Subscription</span>
            <span class="fw-700" id="gym-price-headline-subscription">€{{ gym.monthly_price|floatformat:"-2" }} / mo</span>
        </div>
        {% else %}
        <div id="gym-price-headline-subscription-row" class="row-between gap-sm text-sm" hidden>
            <span>Subscription</span>
            <span class="fw-700" id="gym-price-headline-subscription"></span>
        </div>
        {% endif %}
        {% endif %}
    </button>
</section>
