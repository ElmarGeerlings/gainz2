<section id="gym-panel-overview" class="gym-panel stack-md{% if tab != 'overview' %} hidden{% endif %}" role="tabpanel" aria-labelledby="gym-tab-overview"{% if tab != 'overview' %} hidden{% endif %}>
    <section class="panel stack-sm">
        <div class="row-between gap-sm">
            <h2 class="title-sm m-0">Description</h2>
            {% if user.is_authenticated %}
            <button type="button" class="icon-btn" aria-label="Edit description" data-function="click->ShowModal" data-modal-name="gym-edit-description-modal">
                <i class="fas fa-pen" aria-hidden="true"></i>
            </button>
            {% endif %}
        </div>
        <div id="gym-description-block">
            {% include "gyms/gym_description_block.html" %}
        </div>
    </section>
    <section class="panel stack-sm">
        <div class="row-between gap-sm">
            <h2 class="title-sm m-0">Vibe</h2>
            {% if user.is_authenticated %}
            <button type="button" class="icon-btn" aria-label="Edit vibe" data-function="click->ShowModal" data-modal-name="gym-edit-vibe-modal">
                <i class="fas fa-pen" aria-hidden="true"></i>
            </button>
            {% endif %}
        </div>
        <p class="text-sm m-0" id="gym-vibe-display">{{ gym.get_vibe_display }}</p>
    </section>
    <button type="button" class="panel w-100" data-function="click->jumpToGymHours">
        <div id="gym-overview-hours">
            {% include "gyms/gym_overview_hours.html" %}
        </div>
    </button>
    <button type="button" class="panel stack-sm w-100" data-function="click->ShowModal" data-modal-name="gym-score-modal">
        <h2 class="title-sm m-0">Discipline scores</h2>
        {% for score in discipline_scores %}
        <div class="row-between gap-sm text-sm">
            <span>{{ score.name }}</span>
            <span class="fw-700">{{ score.confirmed }}/{{ score.total }}</span>
        </div>
        {% endfor %}
    </button>
    <button type="button" class="panel stack-sm w-100" data-function="click->ShowModal" data-modal-name="gym-prices-modal">
        <h2 class="title-sm m-0">Prices</h2>
        <div id="gym-price-headlines">
            {% include "gyms/gym_price_headlines.html" %}
        </div>
    </button>
</section>
