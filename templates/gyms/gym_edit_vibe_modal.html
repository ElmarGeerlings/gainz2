<form id="gym-edit-vibe-form" class="form-stack">
    <h2 class="title-md m-0 mb-3">Edit vibe</h2>
    <p class="text-sm text-muted m-0 mb-2">Serious: people treat lifting as a sport. Casual: general fitness gym.</p>
    <div class="gym-status-btns" role="radiogroup" aria-label="Vibe">
        <label class="gym-status-btn">
            <input type="radio" class="gym-status-radio" name="vibe" value="serious"{% if gym.vibe == 'serious' %} checked{% endif %}>
            Serious
        </label>
        <label class="gym-status-btn">
            <input type="radio" class="gym-status-radio" name="vibe" value="casual"{% if gym.vibe == 'casual' %} checked{% endif %}>
            Casual
        </label>
        <label class="gym-status-btn">
            <input type="radio" class="gym-status-radio" name="vibe" value="unknown"{% if gym.vibe == 'unknown' %} checked{% endif %}>
            Unknown
        </label>
    </div>
    <div class="set-modal-actions mt-4">
        <button type="button" class="btn btn-primary w-40 mt-1" data-gym-id="{{ gym.pk }}" data-endpoint="click->gyms/update_vibe" data-close-modal="#gym-edit-vibe-modal">Save</button>
    </div>
</form>
